<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CloudAvid • File Portal</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/home.css">
  <link rel="icon" href="/assets/icon/files-logo.png" type="image/x-icon">
</head>

<body>
  <div class="wrap">
    <div class="home-shell">

      <!-- Top bar -->
      <div class="topbar">
        <a class="brand" href="https://cloudavid.com">
          <img src="/assets/icon/logo.png" alt="CloudAvid">
          <div class="title">
            <strong data-i18n="brand">CloudAvid</strong>
            <span data-i18n="subtitle">File Portal</span>
          </div>
        </a>

      </div>


      <!-- Hero / Search -->
      <div class="home-hero">
        <div>
          <h1 data-i18n="title">CloudAvid Files</h1>
          <p data-i18n="desc">Browse directories or search across all downloads.</p>
        </div>

        <div class="right">
          <div class="search" title="Ctrl+K">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input id="globalSearch" type="text" autocomplete="off" data-i18n-ph="searchPh" />
            <span class="kbd">Ctrl K</span>
          </div>
          <button class="btn primary" id="searchBtn" type="button" data-i18n="searchBtn">Search</button>
          <button class="btn" id="stopBtn" type="button" style="display:none;" data-i18n="stopBtn">Stop</button>
        </div>
      </div>

      <!-- Directory cards -->
      <div class="grid">
        <a class="card" href="/download/download-User/Template/">
          <div class="inner">
            <img src="/assets/icon/template.png" alt="Template">
            <div class="meta">
              <strong data-i18n="template">Template</strong>
              <span data-i18n="templateDesc">Common templates & files</span>
            </div>
          </div>
        </a>

        <a class="card" href="/download/download-User/Sandbox/">
          <div class="inner">
            <img src="/assets/icon/sandbox.png" alt="Sandbox">
            <div class="meta">
              <strong data-i18n="sandbox">Sandbox</strong>
              <span data-i18n="sandboxDesc">Internal sandbox downloads</span>
            </div>
          </div>
        </a>

        <a class="card" href="/download/download-User/LogDB/">
          <div class="inner">
            <img src="/assets/icon/Log.png" alt="Log Server">
            <div class="meta">
              <strong data-i18n="logServer">Log Server</strong>
              <span data-i18n="logServerDesc">Logs & database exports</span>
            </div>
          </div>
        </a>

        <a class="card" href="/download/download-User/ISO/">
          <div class="inner">
            <img src="/assets/icon/iso.png" alt="ISO">
            <div class="meta">
              <strong data-i18n="iso">ISO</strong>
              <span data-i18n="isoDesc">OS images & installers</span>
            </div>
          </div>
        </a>

        <a class="card" href="/download/download-User/imageClone/">
          <div class="inner">
            <img src="/assets/icon/images.png" alt="images">
            <div class="meta">
              <strong data-i18n="imageClone">Images Clone</strong>
              <span data-i18n="images">VMs images</span>
            </div>
          </div>
        </a>

      </div>

      <!-- Search results -->
      <div class="results" id="resultsBox" style="display:none;">
        <div class="results-head">
          <div id="resultsTitle" class="muted">Results</div>
          <div id="progress" class="muted"></div>
        </div>
        <div class="results-list" id="resultsList"></div>
      </div>

      <div class="footer">CloudAvid Co</div>
    </div>
  </div>
  <script src="/assets/js/script.js"></script>
  <script src="/assets/js/app.js"></script>
</body>

</html>
