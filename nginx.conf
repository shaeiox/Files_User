# ==============================================================================
# CloudAvid File Portal - Enterprise Nginx Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP to HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name files.cloudavid.com;

    # Permanently redirect all HTTP traffic to HTTPS securely
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 2. Main HTTPS Server Block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.cloudavid.com;

    # Default root directory for the SPA Frontend Shell
    root /var/www/html/files-server-web;
    index index.html;

    # --------------------------------------------------------------------------
    # SSL/TLS Configuration (Enterprise Security Standards)
    # --------------------------------------------------------------------------
    ssl_certificate         /etc/ssl/certs-web/fullchain-new.pem;
    ssl_certificate_key     /etc/ssl/certs-web/private.key;
    
    # Disable old, insecure protocols (SSLv3, TLSv1, TLSv1.1)
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers             "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    
    # Optimize SSL handshake performance using caching
    ssl_session_cache       shared:SSL:50m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # --------------------------------------------------------------------------
    # Security Headers (Hardening against XSS, Clickjacking, Sniffing)
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # API: Node.js filesystem portal (categories, listings, search, downloads)
    # FILES_ROOT is configured in the Node process .env — not in this file.
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # SPA browse routes for dynamically discovered folders
    location /browse/ {
        try_files $uri @spa;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA Application & Static Assets
    # --------------------------------------------------------------------------
    # Serve static assets (CSS, JS, Icons) with strong browser caching
    location ~* \.(?:css|js|png|jpg|jpeg|svg|ico)$ {
        root /var/www/html/files-server-web;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Main application route
    location / {
        try_files $uri $uri/ @spa;
    }

    # SPA Router Fallback: Directs all directory/unknown paths to index.html
    location @spa {
        rewrite ^ /index.html last;
    }

    # --------------------------------------------------------------------------
    # Security Deny Rules
    # --------------------------------------------------------------------------
    # Deny access to hidden files (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny execution of PHP or backend scripts
    location ~ \.(php|pl|py|cgi)$ {
        deny all;
        return 404;
    }

    # Deny direct access to sensitive server backup and database files
    location ~* \.(backup|bak|sql|env|log)$ {
        deny all;
        return 404;
    }
}