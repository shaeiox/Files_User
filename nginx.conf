server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    # 1. JSON endpoint for listing files and directories
    # Used by JavaScript to retrieve directory contents.
    location /__list/ {
        rewrite ^/__list/(.*)$ /$1 break;
        root /var/www/html;

        # Disable the default index file to force Nginx
        # to generate a JSON directory listing even when index.html exists.
        index no_index_override;

        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
        autoindex_localtime on;

        # Prevent browsers and proxies from caching directory listings.
        add_header Cache-Control "no-store, no-cache";
    }

    # 2. Download path handling and SPA router
    location /download/ {
        # Serve real files directly.
        # If the requested path is a directory, fall back to the SPA router.
        try_files $uri $uri/ @spa;
    }

    # SPA fallback
    location @spa {
        rewrite ^ /index.html last;
    }

    # 3. Frontend files and application routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: Block direct access to backup and archive files in the root directory.
    location ~* \.(zip|tar|backup|bak|gz|sql)$ {
        deny all;
        return 404;
    }
}